name: langex
description: "Langex: learn a language with a partner who speaks it."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.3
  google_sign_in: ^7.2.0
  http: ^1.6.0
  intl: ^0.20.3
  sign_in_with_apple: ^8.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  google_sign_in_platform_interface: ^3.1.0
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  generate: true  # localisations from lib/l10n/*.arb

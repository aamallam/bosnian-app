# Render Blueprint for the free staging API (ADR 0010).
# Render -> New -> Blueprint -> pick this repository. Values marked
# `sync: false` are asked for once in the Render dashboard; they never live in git.
services:
  - type: web
    name: langex-api-staging
    runtime: docker
    plan: free
    region: frankfurt # closest Render region to Bosnia and the Gulf
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: LANGEX_ENV
        value: staging
      - key: LANGEX_DATABASE_URL
        sync: false # Neon connection string (direct, with sslmode=require)
      - key: LANGEX_JWT_SECRET
        generateValue: true # random, generated by Render
      - key: LANGEX_GOOGLE_CLIENT_IDS
        sync: false # comma-separated OAuth client IDs (Android, iOS, web)
      - key: LANGEX_APPLE_CLIENT_IDS
        sync: false # the iOS bundle ID / Services ID
      - key: FORWARDED_ALLOW_IPS
        value: "*" # the container is reachable only through Render's proxy

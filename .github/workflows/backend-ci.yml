name: backend-ci

on:
  push:
    branches: [main]
  pull_request:
    paths: ["backend/**", "render.yaml", ".github/workflows/backend-ci.yml"]

# Least privilege: jobs get read-only access unless they ask for more.
permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs (supply-chain safety); Dependabot bumps them.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Types
        run: mypy
      - name: Architecture boundaries
        run: lint-imports
      - name: Tests with coverage
        run: pytest --cov --cov-report=term-missing
      - name: Static security analysis
        run: bandit -q -r src
      - name: Dependency vulnerabilities
        run: pip-audit --skip-editable

  # The same tests again on real PostgreSQL (locally they use SQLite):
  # repositories, guarded updates under concurrency and migrations.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: langex_test
          POSTGRES_USER: langex
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U langex -d langex_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://langex:ci-only-password@localhost:5432/langex_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests on PostgreSQL
        run: pytest tests/persistence tests/api

  # Build the production image and check that it starts and answers.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t langex-api:ci .
      - name: Smoke test
        run: |
          secret="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          docker run -d --name api -p 8000:8000 \
            -e LANGEX_ENV=development \
            -e LANGEX_DATABASE_URL=sqlite+pysqlite:////tmp/smoke.db \
            -e LANGEX_JWT_SECRET="$secret" \
            langex-api:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/readyz
          curl -fsS http://127.0.0.1:8000/v1/languages | grep -q '"code":"bs"'
          test "$(docker exec api id -u)" = "10001"
      - name: Logs on failure
        if: failure()
        run: docker logs api

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
